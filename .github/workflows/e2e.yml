# The browser end-to-end suite, in the two modes it has.
#
# `.github/workflows/checks.yml` runs everything that needs no credentials:
# typegen, tsc, lint, the Node suites (which include the two offline fences on
# this harness and the coverage map) and a real build. This file is the other
# half: runs that talk to the DEV Firebase project, create throwaway accounts,
# drive Chromium and tear the fixtures down again.
#
# HOW IT GETS CREDENTIALS. Workload Identity Federation, not a stored key:
# the auth step exchanges a short-lived OIDC token, which GitHub mints for
# this workflow, for Application Default Credentials in the runner.
#
# WHY `pull_request` AND NEVER `pull_request_target`. `pull_request_target`
# runs the workflow definition from the base branch with write-scoped secrets
# available to a job checking out a fork's code. That is the standard way to
# hand a stranger's branch your credentials. `pull_request` runs the fork's
# code with no id-token, which is why the local job below skips fork pull
# requests outright rather than pretending to cover them.
#
# WHAT IT COSTS TO GET THIS WRONG. Both modes write to the dev project: real
# Auth accounts, real Firestore rows, real mail attempts. The runner tears down
# in a `finally` and the exit code carries the manifest, so a green run is also
# a run that left nothing behind. A CANCELLED run is the exception, which is
# why `cancel-in-progress` is false below.
#
# TWO JOBS HERE DRIVE NOTHING. `result` reads why the suite has the result it
# has and is the check the branch rules require: a job skipped by its own `if:`
# counts as a success to GitHub, and a suite that could not run has not passed.
# `nightly-alert` opens an issue when the scheduled run does not pass, because
# a scheduled run has no pull request to turn red. Neither job is given the
# cloud identity; each declares its own, smaller, permissions.
name: End to end

on:
  # The local job only. It boots the app on loopback with a relaxed captcha and
  # Mailpit, so it can drive the legs a deployed target refuses.
  pull_request:
  # The dev job only: the deployed backend, real secrets, real reCAPTCHA.
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC, nightly
  workflow_dispatch:

permissions:
  # Required to mint the OIDC token Workload Identity Federation exchanges.
  id-token: write
  contents: read

# THE CONCURRENCY GROUP, declared on the two jobs that drive the dev project
# (`local` and `dev`) and on nothing else.
#
# ONE GROUP FOR BOTH, deliberately not per ref. Every run of either job, on any
# branch and from any trigger, drives the SAME dev Firebase project. Fixture
# ids are per run, so ordinary rows never collide, but two things in that
# project are singletons that a spec has to borrow and give back: the
# `config/membership` pointer the membership console rewrites when it makes a
# period current, and the reCAPTCHA-relaxed loopback port a local run binds.
# The membership spec snapshots that pointer before it seeds and restores it in
# teardown, so an overlapping pair would restore a pointer to a period the
# other run has already deleted, and BOTH manifests would still read zero: the
# corruption is invisible to the thing that is supposed to catch it. Running
# one at a time is the fix, and it is why a pull request run and the 03:00
# nightly cannot overlap either.
#
# NOT cancelled (`cancel-in-progress: false`). A run killed part way leaves its
# fixture on the shared dev project and its ledger in a workspace that is about
# to be deleted, so nothing can find the rows again.
#
# AND EVERY RUN WAITS ITS TURN (`queue: max`). By default a group holds one
# waiting run, and a newer arrival CANCELS it. Three pull requests opened in a
# row therefore left the middle one with a cancelled end-to-end run, which is
# harmless when the result is advisory and a blocked merge once it is required.
#
# On the jobs rather than the workflow, so that a run whose suite is skipped
# (a Dependabot pull request, a fork) never joins the queue: its `result` job
# answers at once instead of waiting behind every run ahead of it.

jobs:
  local:
    name: Local mode (loopback server, captcha relaxed, mail into Mailpit)
    # Three conditions, for three different reasons. `result`, at the foot of
    # this file, decides what a skip MEANS for the pull request; this only
    # decides whether the suite can run.
    #
    # 1. No `GCP_WORKLOAD_IDENTITY_PROVIDER` variable means the repository has
    #    no test identity, so nothing here could authenticate.
    # 2. A pull request from a FORK gets no id-token (`pull_request` withholds
    #    it), so the exchange cannot happen at all.
    # 3. A run STARTED BY DEPENDABOT is given none of the repository's secrets,
    #    so the browser specs cannot sign in as the admin they drive. It is
    #    also the right run to keep credentials away from: the code under test
    #    is a dependency nobody has read yet. A maintainer who has read it
    #    pushes a commit to the branch, and that run is theirs.
    if: >-
      github.event_name == 'pull_request'
      && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    concurrency:
      group: e2e-${{ github.workflow }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The persona battery (scripts/e2e/tests/persona-route-gates.test.mjs)
      # drives every route as every persona against a SECOND copy of the
      # build pointed at a Firestore emulator, so the elevated roles it needs
      # never exist on the dev project. The emulator is a Java process that
      # firebase-tools downloads and runs; firebase-tools is a devDependency
      # of the rules-test package rather than the root one for the same
      # reason Playwright is not: the root `npm ci` is on the critical path of
      # every production deploy. E2E_PERSONA_BATTERY=required below turns a
      # missing emulator into a red job rather than a quiet skip.
      - run: npm ci
        working-directory: scripts/rules-tests
      # 21, because firebase-tools 15 refuses anything older ("no longer
      # supports Java version before 21") and the version it replaces runs on
      # 21 as well.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      # The emulator jar firebase-tools downloads on first use, kept between
      # runs so the persona battery does not fetch it every time.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('scripts/rules-tests/package-lock.json') }}

      # Deliberately not a dependency: the root package.json is on the critical
      # path of every production deploy's `npm ci`, and a browser automation
      # library plus a downloaded Chromium has no business there. The runner
      # refuses to run without Playwright and prints this same line.
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      # Mailpit catches every message the loopback server sends, so a spec can
      # read what a route actually put in an inbox. Pinned to a release and
      # checked against its published SHA256: this binary handles the mail of a
      # run that creates accounts, and "latest" is not a thing to trust with
      # that.
      - name: Install Mailpit
        env:
          MAILPIT_VERSION: v1.31.1
          MAILPIT_SHA256: 87d2652abd7c17dc99029147ff62ac671afdf7fd76630f7faf5b14125211c709
        run: |
          set -euo pipefail
          # Retried, because this is a third-party CDN on the critical path of
          # every run including the nightly. curl's own --retry already covers
          # the transient HTTP codes (408, 429, 500, 502, 503, 504);
          # --retry-all-errors extends it to connection resets and DNS blips.
          # Safe to retry blindly: the download is pinned to a version and
          # checked against its published SHA256 on the next line, so a
          # corrupt or substituted body still fails hard.
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --retry-max-time 180 \
            -o mailpit.tar.gz \
            "https://github.com/axllent/mailpit/releases/download/${MAILPIT_VERSION}/mailpit-linux-amd64.tar.gz"
          echo "${MAILPIT_SHA256}  mailpit.tar.gz" | sha256sum -c -
          tar -xzf mailpit.tar.gz mailpit
          sudo install -m 0755 mailpit /usr/local/bin/mailpit
          rm -f mailpit.tar.gz mailpit
          # NOT `mailpit version`: that subcommand asks api.github.com for the
          # latest release and exits non-zero when the unauthenticated call is
          # rate-limited. The binary has already been proven by the checksum;
          # this only shows it runs.
          mailpit --help >/dev/null
          echo "mailpit ${MAILPIT_VERSION} installed"

      # Application Default Credentials for the dev project, from the OIDC
      # token above. The provider and the service account are read from
      # repository variables.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_E2E_SERVICE_ACCOUNT }}

      # CLOUD-SIDE CONFIGURATION, which `npm test` cannot see: it is offline by
      # contract, and an API key's restrictions live only in the project. This
      # step holds the project's keys to the registry in
      # scripts/check-api-key-restrictions.mjs, on every run.
      #
      # The run's identity needs permission to list the project's API keys.
      # Read-only: `keys.list` never returns key material. See
      # scripts/e2e/README.md, "In CI".
      - name: Check the dev project's API key restrictions
        run: node scripts/check-api-key-restrictions.mjs --project naisi-uk-dev

      # The harness's own config. No secrets: the project id is a name and the
      # web API key is public by definition (Next inlines it into the client
      # bundle, so it ships to every browser that opens the dev site). That is
      # the same argument checks.yml makes for its build placeholders.
      #
      # It is nonetheless read from a repository VARIABLE rather than written
      # here, and the reason is noise, not secrecy: a scanner that crawls
      # public repositories for anything key-shaped cannot tell a
      # public-by-design Firebase web key from a billable one. Still a variable
      # and not a secret: it ships to every browser anyway.
      #
      # Passed through `env` rather than interpolated into the script, because
      # a `${{ }}` expression expanded straight into `run` is the standard
      # shell-injection shape and this file is not going to model it.
      - name: Write .env.e2e.local
        env:
          FIREBASE_WEB_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_WEB_API_KEY}" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_FIREBASE_API_KEY is not set."
            echo "It is the DEV project's public Firebase web key. See scripts/e2e/README.md, 'In CI'."
            exit 1
          fi
          cat > .env.e2e.local <<'EOF'
          E2E_TARGET=http://127.0.0.1:3100
          FIREBASE_ADMIN_PROJECT_ID=naisi-uk-dev
          EOF
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=${FIREBASE_WEB_API_KEY}" >> .env.e2e.local

      # The app the local server builds needs the dev project's PUBLIC Firebase
      # config to inline, and only these values. scripts/e2e/run.mjs sets the
      # rest itself: it forces the SMTP onto Mailpit, mints a fresh token secret
      # per run and swaps in the always-pass captcha secret.
      - name: Write .env.local
        env:
          FIREBASE_WEB_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=naisi-uk-dev.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=naisi-uk-dev
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=naisi-uk-dev.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=504520179433
          NEXT_PUBLIC_FIREBASE_APP_ID=1:504520179433:web:c72de749714dccc24e3a78
          FIREBASE_ADMIN_PROJECT_ID=naisi-uk-dev
          EOF
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=${FIREBASE_WEB_API_KEY}" >> .env.local

      # The nine fetch batteries under scripts/e2e/tests/ FIRST, because the
      # coverage map credits them with the registration and magic-link routes
      # (AUTH_BATTERIES in tests/e2e-coverage-map.test.mjs) and a credit no CI
      # job collects is a credit that goes stale unnoticed. This boots its own
      # loopback server with Mailpit and shuts it down again; the browser step
      # below then reuses the build it just made.
      - name: Run the fetch batteries against a loopback server
        env:
          E2E_SIGNING_SERVICE_ACCOUNT: ${{ vars.GCP_E2E_SERVICE_ACCOUNT }}
          E2E_PERSONA_BATTERY: required
        run: npm run e2e:local

      # `--skip-build`: the batteries step above built the app from the same
      # env, and scripts/e2e/run.mjs rebuilds anyway if its marker says the
      # values baked in differ.
      - name: Run the browser specs against a loopback server
        env:
          # Custom tokens are signed by asking IAM to sign as this account. In
          # CI that is the account the run itself authenticates as, which has
          # to be allowed to sign as itself: see scripts/e2e/README.md.
          E2E_SIGNING_SERVICE_ACCOUNT: ${{ vars.GCP_E2E_SERVICE_ACCOUNT }}
          # An admin account the harness is given, for the specs that drive an
          # admin-only screen. The harness can never create one: the fence
          # forbids writing any role above `pending`.
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: node scripts/run-e2e.mjs --local --skip-build

      # Runs even when the job is CANCELLED, which is the one case the
      # runner's own `finally` cannot cover: the step above is killed before
      # its teardown finishes and the machine is discarded with the ledgers.
      # This reads the ledgers `.e2e-state/` still holds and tears down exactly
      # what they name; it needs no admin account and drives no browser. Red
      # when a row is left behind, so a leak is a failed step rather than a
      # silent one.
      - name: Tear down whatever the ledgers still name
        if: always()
        env:
          E2E_SIGNING_SERVICE_ACCOUNT: ${{ vars.GCP_E2E_SERVICE_ACCOUNT }}
        run: |
          # The harness has no project to write to until "Write .env.e2e.local"
          # has run, so a job that died before that step cannot have seeded
          # anything. Say so and stop, rather than failing on the missing file:
          # a red teardown means "rows were left on dev", and it has to keep
          # meaning that. Everything from that step onward still tears down as
          # before, and still goes red when a row survives it.
          if [ ! -f .env.e2e.local ]; then
            echo "No .env.e2e.local: the job ended before the harness was configured, so nothing was seeded and there is nothing to tear down."
            exit 0
          fi
          node scripts/run-e2e.mjs --teardown

      # The ledgers, always on a failure. They matter most on a failure that
      # also failed to tear down: they name the rows still sitting on the dev
      # project. They carry fixture ids and e2e.invalid addresses only, which
      # is why this half needs no opt-in.
      - name: Upload the fixture ledgers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-local-state
          path: .e2e-state
          if-no-files-found: ignore
          # Both directories are dotfolders, which upload-artifact v4.4+ skips
          # by default: without this line an upload here reports success and
          # carries nothing.
          include-hidden-files: true
          retention-days: 7

      # THE SCREENSHOTS ARE OPT-IN, and this is why. `.e2e-artifacts` holds a
      # full-page screenshot and the page text of the step that failed, and an
      # admin screen can show personal data. An artifact on a public repository
      # can be downloaded by anybody. So the upload waits for somebody to set
      # E2E_UPLOAD_SCREENSHOTS to "true" as a repository variable, for as long
      # as they are chasing a failure, and the retention is one day rather than
      # seven. Without it a failure still gives the step name, the runner's log
      # and the ledger, which is usually where the answer is anyway.
      - name: Upload the failing step's screenshots and traces
        if: failure() && vars.E2E_UPLOAD_SCREENSHOTS == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-local-artifacts
          path: .e2e-artifacts
          if-no-files-found: ignore
          # Both directories are dotfolders, which upload-artifact v4.4+ skips
          # by default: without this line an upload here reports success and
          # carries nothing.
          include-hidden-files: true
          retention-days: 1

  dev:
    name: Dev backend (deployed, real secrets, real reCAPTCHA)
    # Nightly and on demand only: this drives the deployed dev backend, so it
    # proves the wiring (secret resolution, real SMTP, real reCAPTCHA keys) that
    # a loopback server cannot. Same skip when federation is not configured.
    if: >-
      github.event_name != 'pull_request'
      && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    # The same group as `local`: see the note above `jobs:`.
    concurrency:
      group: e2e-${{ github.workflow }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The nightly checks out the branch the target DEPLOYS FROM. A
          # scheduled run always starts on the default branch, main, but
          # dev.naisi.uk is built from `dev`, so without this line the 03:00
          # run drives dev's app with main's specs, and the two disagree
          # whenever dev is ahead of main. A dispatch keeps the ref it was
          # given (`gh workflow run "End to end" --ref <branch>`). The workflow
          # FILE still comes from main on a schedule, because GitHub reads a
          # scheduled workflow's definition from the default branch, so a
          # change to this file reaches the nightly only once it is promoted.
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      # No Mailpit here, and no .env.local: nothing is built and nothing is
      # started. The target is the deployed dev backend, whose mail goes to the
      # real sender, which is exactly why every fixture address is suppressed
      # before a deployed-mode run seeds anything.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_E2E_SERVICE_ACCOUNT }}

      # CLOUD-SIDE CONFIGURATION, which `npm test` cannot see: it is offline by
      # contract, and an API key's restrictions live only in the project. This
      # step holds the project's keys to the registry in
      # scripts/check-api-key-restrictions.mjs, on every run.
      #
      # The run's identity needs permission to list the project's API keys.
      # Read-only: `keys.list` never returns key material. See
      # scripts/e2e/README.md, "In CI".
      - name: Check the dev project's API key restrictions
        run: node scripts/check-api-key-restrictions.mjs --project naisi-uk-dev

      # Same repository variable as the local job, for the same reason: see the
      # note on that step.
      - name: Write .env.e2e.local
        env:
          FIREBASE_WEB_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_WEB_API_KEY}" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_FIREBASE_API_KEY is not set."
            echo "It is the DEV project's public Firebase web key. See scripts/e2e/README.md, 'In CI'."
            exit 1
          fi
          cat > .env.e2e.local <<'EOF'
          E2E_TARGET=https://dev.naisi.uk
          FIREBASE_ADMIN_PROJECT_ID=naisi-uk-dev
          EOF
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=${FIREBASE_WEB_API_KEY}" >> .env.e2e.local

      # The same nine batteries, against the deployed backend. The three that
      # need a relaxed captcha or a readable inbox skip themselves here and say
      # so; what remains proves the deployed wiring the loopback server cannot
      # (real secret resolution, the real reCAPTCHA key, the real gate).
      - name: Run the fetch batteries against dev.naisi.uk
        env:
          E2E_SIGNING_SERVICE_ACCOUNT: ${{ vars.GCP_E2E_SERVICE_ACCOUNT }}
        run: npm run e2e

      # The reCAPTCHA-dependent legs SKIP here, by design: against a deployed
      # target Google's real widget answers headless Chromium with an image
      # challenge, which no spec may solve. The runner accepts exactly the
      # steps each spec declares gated, for exactly the shared reason, and
      # prints what it accepted.
      - name: Run the browser specs against dev.naisi.uk
        env:
          E2E_SIGNING_SERVICE_ACCOUNT: ${{ vars.GCP_E2E_SERVICE_ACCOUNT }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          # The harness bypass (src/lib/recaptcha/bypass.ts). Against a backend
          # that holds the same value the reCAPTCHA dependent steps run for
          # real; without it they are skipped and the runner says so.
          E2E_RECAPTCHA_BYPASS_SECRET: ${{ secrets.E2E_RECAPTCHA_BYPASS_SECRET }}
        run: node scripts/run-e2e.mjs

      # Runs even when the job is CANCELLED, which is the one case the
      # runner's own `finally` cannot cover: the step above is killed before
      # its teardown finishes and the machine is discarded with the ledgers.
      # This reads the ledgers `.e2e-state/` still holds and tears down exactly
      # what they name; it needs no admin account and drives no browser. Red
      # when a row is left behind, so a leak is a failed step rather than a
      # silent one.
      - name: Tear down whatever the ledgers still name
        if: always()
        env:
          E2E_SIGNING_SERVICE_ACCOUNT: ${{ vars.GCP_E2E_SERVICE_ACCOUNT }}
        run: |
          # The harness has no project to write to until "Write .env.e2e.local"
          # has run, so a job that died before that step cannot have seeded
          # anything. Say so and stop, rather than failing on the missing file:
          # a red teardown means "rows were left on dev", and it has to keep
          # meaning that. Everything from that step onward still tears down as
          # before, and still goes red when a row survives it.
          if [ ! -f .env.e2e.local ]; then
            echo "No .env.e2e.local: the job ended before the harness was configured, so nothing was seeded and there is nothing to tear down."
            exit 0
          fi
          node scripts/run-e2e.mjs --teardown

      - name: Upload the fixture ledgers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-dev-state
          path: .e2e-state
          if-no-files-found: ignore
          # Both directories are dotfolders, which upload-artifact v4.4+ skips
          # by default: without this line an upload here reports success and
          # carries nothing.
          include-hidden-files: true
          retention-days: 7

      # Opt-in for the same reason as the local job: see the note on that step.
      - name: Upload the failing step's screenshots and traces
        if: failure() && vars.E2E_UPLOAD_SCREENSHOTS == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-dev-artifacts
          path: .e2e-artifacts
          if-no-files-found: ignore
          # Both directories are dotfolders, which upload-artifact v4.4+ skips
          # by default: without this line an upload here reports success and
          # carries nothing.
          include-hidden-files: true
          retention-days: 1

  result:
    name: End-to-end result
    # THE CHECK THE BRANCH RULES REQUIRE from this workflow, by this exact name
    # (scripts/check-branch-rules.mjs holds the name and
    # tests/branch-rules.test.mjs holds the two together). It runs whatever
    # became of `local`, including nothing, and answers for it: the table of
    # what counts as a pass is at the top of scripts/ci/e2e-result.mjs.
    needs: [local]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reads the repository and nothing else. No id-token: this job never
    # touches the dev project.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every value arrives through `env`, never interpolated into the script.
      - name: Read what became of the suite
        env:
          LOCAL_RESULT: ${{ needs.local.result }}
          BASE_REF: ${{ github.base_ref }}
          ACTOR: ${{ github.actor }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          IDENTITY_CONFIGURED: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        run: node scripts/ci/e2e-result.mjs

  nightly-alert:
    name: Tell the owner how the nightly went
    # On the schedule only, and whatever became of `dev`: failed, cancelled or
    # SKIPPED. A skip on a schedule means the test identity is not configured,
    # which is the failure that makes no noise at all. A dispatched run is
    # somebody watching, so it is left alone.
    needs: [dev]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # A scheduled run starts on the default branch, so this is main's copy of
      # the script, like the workflow file itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open, update or close the alert
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_KEY: nightly-e2e
          ALERT_WHAT: The nightly end-to-end run
          ALERT_RESULT: ${{ needs.dev.result }}
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Who is told. A repository variable, so it changes without a pull
          # request; the fallback is there so an unset variable cannot make the
          # alert silent.
          ALERT_ASSIGNEES: ${{ vars.ALERT_ASSIGNEES || 'LevidaLoca' }}
        run: node scripts/ci/alert-issue.mjs
